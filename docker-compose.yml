# AI Health Assistant — production stack
#
#   cp .env.example .env    # then fill in DATABASE_URL, DIRECT_URL, JWT_SECRET, GROQ_API_KEY
#   docker compose up -d --build
#
# App: http://localhost  (API is proxied by nginx at /api)

name: ai-health

services:
  backend:
    build:
      context: ./AI Health Assistant/backend
      target: prod
    image: ai-health-backend:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # nginx sits in front of the API, so trust one proxy hop for client IPs (rate limits)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Browsers send an Origin header even for same-origin POSTs, so the app's own URL must be allowed
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    # Loopback only: the API trusts X-Forwarded-For from nginx, so a port reachable from the
    # network would let callers fake their IP and dodge rate limits. Public traffic goes via nginx /api.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./AI Health Assistant/frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    image: ai-health-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # Optional — start with: docker compose --profile redis up -d
  # The backend's rate limiter is currently in-memory; Redis is provisioned for a shared
  # store when running several backend replicas.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs:
  redis-data:
