# nginx config for the AI Health Assistant SPA (installed as /etc/nginx/conf.d/default.conf)

# Docker's embedded DNS — lets nginx start even if the backend container isn't resolvable yet
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;   # backend accepts 5 MB image uploads

    # ---- gzip --------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/xml image/svg+xml application/manifest+json font/ttf font/otf;

    # ---- security headers (repeated in locations that set their own headers) --
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self): the symptom page uses voice input
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- container health check -------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API → backend container ------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # AI analysis calls can take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- hashed build assets: cache for a year ----------------------------
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # ---- other static files (favicon, icons): cache for a day -------------
    location ~* \.(?:svg|png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # ---- React Router: unknown paths fall back to index.html ---------------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or users keep stale asset hashes after a deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
