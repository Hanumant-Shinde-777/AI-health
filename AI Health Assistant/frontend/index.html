<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="color-scheme" content="dark light" />
    <title>AI Health Assistant</title>
    <script>
      // Apply the saved theme before first paint (no flash). Keep in sync with src/context/ThemeContext.tsx
      ;(function () {
        try {
          var pref = localStorage.getItem('ai-health-theme') || 'dark'
          var light = pref === 'light' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fb')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body class="bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
